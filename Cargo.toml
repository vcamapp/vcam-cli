[package]
name = "vcam"
version = "0.1.0"
edition = "2024"
description = "Command line tool and MCP server for the VCam API"
license = "MIT"
repository = "https://github.com/vcamapp/vcam-cli"
homepage = "https://github.com/vcamapp/vcam-cli"
publish = false

[package.metadata.dist]
# publish = false keeps the crate off crates.io, which would otherwise also hide it from dist
dist = true

[[bin]]
name = "vcam"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "signal", "fs"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
